name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: go test ./... -v
      - run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              bin="kyfram-$os-$arch"
              [ "$os" = "linux" ] && bin="kyfram-$os-$arch" || true
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o dist/$bin ./cmd/kyfram
            done
          done
          ls -lh dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
