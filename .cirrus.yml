env:
  GOPATH: $HOME/go
  PATH: $GOPATH/bin:$PATH

container:
  image: golang:1.25

# Cache Go modules — mirrors actions/setup-go cache: true (keyed on go.sum)
modules_cache:
  fingerprint_script: cat go.sum
  folder: $GOPATH/pkg/mod

# CI — mirrors .github/workflows/ci.yml (push: master/main, pull_request, go mod download, build, vet, test, lint)
test_task:
  name: "test"
  only_if: $CIRRUS_TAG == "" && ($CIRRUS_BRANCH == "master" || $CIRRUS_BRANCH == "main" || $CIRRUS_PR != "")
  mod_download_script: go mod download
  build_script: go build ./...
  vet_script: go vet ./...
  test_script: go test ./... -v

lint_task:
  name: "lint"
  only_if: $CIRRUS_TAG == "" && ($CIRRUS_BRANCH == "master" || $CIRRUS_BRANCH == "main" || $CIRRUS_PR != "")
  # mirrors golangci/golangci-lint-action@v6 with version v2.1
  install_script: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v2.1.0
  lint_script: golangci-lint run

# Release — mirrors .github/workflows/release.yml (push tags v*, go test + cross-build ./cmd/kyfram)
release_task:
  name: "release"
  only_if: $CIRRUS_TAG =~ "v.*"
  test_script: go test ./... -v
  build_script: |
    mkdir -p dist
    for os in linux darwin; do
      for arch in amd64 arm64; do
        bin="kyfram-$os-$arch"
        GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o dist/$bin ./cmd/kyfram
      done
    done
    ls -lh dist/
