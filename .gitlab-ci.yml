image: golang:1.25

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

cache:
  key: go-mod-$CI_COMMIT_REF_SLUG
  paths:
    - .go/pkg/mod/
  policy: pull-push

stages:
  - build
  - test
  - lint
  - deploy

before_script:
  - go mod download

build:
  stage: build
  script:
    - go build ./...

vet:
  stage: test
  script:
    - go vet ./...

test:
  stage: test
  script:
    - go test ./... -v

lint:
  stage: lint
  script:
    - export PATH="$GOPATH/bin:$PATH"
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
    - golangci-lint run
  allow_failure: false

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build-binaries]
  before_script: [] # release-cli image has no Go toolchain
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "Install: curl -fsSL https://kyfram-site-68056d.gitlab.io/install.sh | sh -s -- $CI_COMMIT_TAG"
    assets:
      links:
        - name: kyfram-linux-amd64
          url: https://gitlab.com/codetesla51/kyfram/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/kyfram-linux-amd64?job=build-binaries
        - name: kyfram-linux-arm64
          url: https://gitlab.com/codetesla51/kyfram/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/kyfram-linux-arm64?job=build-binaries
        - name: kyfram-darwin-amd64
          url: https://gitlab.com/codetesla51/kyfram/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/kyfram-darwin-amd64?job=build-binaries
        - name: kyfram-darwin-arm64
          url: https://gitlab.com/codetesla51/kyfram/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/kyfram-darwin-arm64?job=build-binaries

build-binaries:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p dist
    - go build -trimpath -o dist/kyfram-linux-amd64 ./cmd/kyfram
    - env GOOS=linux GOARCH=arm64 go build -trimpath -o dist/kyfram-linux-arm64 ./cmd/kyfram
    - env GOOS=darwin GOARCH=amd64 go build -trimpath -o dist/kyfram-darwin-amd64 ./cmd/kyfram
    - env GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/kyfram-darwin-arm64 ./cmd/kyfram
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
