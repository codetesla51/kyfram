image: golang:1.25

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

cache:
  key: go-mod-$CI_COMMIT_REF_SLUG
  paths:
    - .go/pkg/mod/
  policy: pull-push

stages:
  - build
  - test
  - lint
  - deploy

before_script:
  - go mod download

build:
  stage: build
  script:
    - go build ./...

vet:
  stage: test
  script:
    - go vet ./...

test:
  stage: test
  script:
    - go test ./... -v

lint:
  stage: lint
  script:
    - export PATH="$GOPATH/bin:$PATH"
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
    - golangci-lint run
  allow_failure: false

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "Install: curl -fsSL https://codetesla51.gitlab.io/kyfram/install.sh | sh -s -- $CI_COMMIT_TAG"

pages:
  stage: deploy
  script:
    - mkdir -p public/videos
    - cp site/index.html site/style.css site/script.js public/
    - cp -r site/docs public/
    - cp site/videos/* public/videos/
    - cp logo.png install.sh public/
    - ls -l public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
